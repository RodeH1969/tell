<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TELL</title>
  <link rel="icon" href="logo.jpeg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SPLASH -->
<div id="screen-splash" class="screen active">
  <img src="logo.jpeg" alt="TELL" class="splash-logo">
  <p class="splash-tag">Five faces. One truth. No mercy.</p>
</div>

<!-- CREATOR -->
<div id="screen-creator" class="screen">
  <img src="logo.jpeg" alt="TELL" class="lobby-logo">
  <label class="field-label">YOUR NAME</label>
  <input id="input-creator-name" class="name-input pulsing" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off">
  <button id="btn-challenge" class="btn-primary" onclick="createGame()" disabled>CHALLENGE A FRIEND</button>
</div>

<!-- WAITING -->
<div id="screen-waiting" class="screen">
  <img src="logo.jpeg" alt="TELL" class="waiting-logo">
  <button class="btn-primary share-invite-btn" onclick="shareInvite()">SEND CHALLENGE →</button>
  <div id="waiting-status" class="hidden">
    <p class="waiting-label">CHALLENGE SENT</p>
    <p class="waiting-sub">Waiting for your opponent to join…</p>
    <div class="waiting-dots"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- JOINER -->
<div id="screen-joiner" class="screen">
  <img src="logo.jpeg" alt="TELL" class="lobby-logo">
  <p class="join-challenge-msg">You've been challenged!</p>
  <label class="field-label">YOUR NAME</label>
  <input id="input-joiner-name" class="name-input pulsing" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off">
  <button id="btn-join" class="btn-primary" onclick="joinGame()" disabled>JOIN NOW</button>
  <p id="join-error-msg" class="join-error hidden"></p>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">

  <!-- Header: MY NAME | ROUND | OPP NAME -->
  <div id="game-header">
    <div class="score-block">
      <span class="score-name" id="hdr-my-name">YOU</span>
      <span class="score-num" id="hdr-my-score">0</span>
    </div>
    <div class="round-badge" id="hdr-round">1 / 5</div>
    <div class="score-block right">
      <span class="score-name" id="hdr-opp-name">OPP</span>
      <span class="score-num" id="hdr-opp-score">0</span>
    </div>
  </div>

  <div id="timer-track"><div id="timer-fill"></div></div>
  <div id="faces-row"></div>
  <button id="audio-play-btn" onclick="void(0)" style="display:none">🔊 TAP TO HEAR QUESTION</button>

  <!-- BOTTOM: Pink | Strip | Blue -->
  <div id="game-bottom">
    <div class="side-label" id="strip-left-label" style="color:#e75480">PINK</div>
    <div id="strip-area">
      <div id="answer-strip"></div>
    </div>
    <div class="side-label" id="strip-right-label" style="color:#3498db">BLUE</div>
  </div>

  <div id="status-bar"></div>
</div>

<!-- FINAL PHASE -->
<div id="screen-final" class="screen">
  <div id="final-header">
    <h2 class="final-title">FINAL CHANCE</h2>
    <p class="final-sub">Tap two name buttons to swap them</p>
  </div>
  <div id="final-timer-track"><div id="final-timer-fill"></div></div>

  <div id="final-my-section">
    <p class="final-section-label">YOUR PICKS — tap to swap</p>
    <div id="final-my-cards" class="final-cards-row"></div>
  </div>

  <div id="final-opp-section">
    <p class="final-section-label" id="final-opp-label">OPPONENT'S CHOICES</p>
    <div id="final-opp-cards" class="final-cards-row"></div>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <img src="logo.jpeg" alt="TELL" class="result-logo">
  <div id="result-verdict"></div>
  <div id="result-scores"></div>
  <div id="result-breakdown"></div>
  <button class="btn-primary share-btn" onclick="shareResult()">Come play TELL with me →</button>
</div>

<!-- POPUP -->
<div id="popup-letsplay" class="popup hidden">
  <div class="popup-inner">
    <img src="logo.jpeg" alt="TELL" style="width:80px;margin-bottom:12px">
    <p class="popup-text">Let's Play Tell!</p>
  </div>
</div>

<canvas id="fireworks-canvas"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
